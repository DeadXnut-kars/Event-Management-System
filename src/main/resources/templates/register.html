<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Register - ' + ${event.title}">Event Registration - EventHub</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- Navigation / Back -->
                    <a th:href="@{/events/{id}(id=${event.id})}" class="text-decoration-none text-muted mb-3 d-inline-block">
                        <i class="bi bi-arrow-left me-1"></i> Back to Event Details
                    </a>

                    <!-- Event Quick Banner -->
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-primary text-white">
                        <span class="badge bg-light text-primary align-self-start mb-2 px-3 py-1 rounded-pill" 
                              th:text="${event.category}">Category</span>
                        <h3 class="fw-bold mb-2" th:text="${event.title}">Event Title</h3>
                        <div class="d-flex flex-wrap gap-3 small text-white-50">
                            <div><i class="bi bi-calendar3 me-1"></i> <span th:text="${event.formattedDate}">Date</span></div>
                            <div><i class="bi bi-geo-alt me-1"></i> <span th:text="${event.venue}">Venue</span></div>
                            <div><i class="bi bi-person-check me-1"></i> <span th:text="${event.seatsLeft + ' seats left'}">Seats</span></div>
                        </div>
                    </div>

                    <!-- Flash / Error Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">Error notification</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Registration Form Card -->
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                        <div class="border-bottom pb-3 mb-4">
                            <h4 class="fw-bold mb-1">Attendee Registration</h4>
                            <p class="text-muted small mb-0">Fill in your information below to reserve your spot and receive your pass.</p>
                        </div>

                        <form th:action="@{/events/{id}/register(id=${event.id})}" th:object="${registration}" method="post">
                            <div class="row g-3">
                                <!-- Full Name -->
                                <div class="col-md-12">
                                    <label for="participantName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                        <input type="text" id="participantName" th:field="*{participantName}" 
                                               class="form-control" th:classappend="${#fields.hasErrors('participantName')} ? 'is-invalid' : ''"
                                               placeholder="e.g. Alex Rivera" required>
                                        <div class="invalid-feedback" th:errors="*{participantName}">Name is required</div>
                                    </div>
                                </div>

                                <!-- Email Address -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="email" th:field="*{email}" 
                                               class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                               placeholder="e.g. alex@example.com" required>
                                        <div class="invalid-feedback" th:errors="*{email}">Valid email required</div>
                                    </div>
                                    <small class="text-muted" style="font-size: 0.75rem;">One registration allowed per email.</small>
                                </div>

                                <!-- Phone Number -->
                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                                        <input type="tel" id="phone" th:field="*{phone}" 
                                               class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                               placeholder="e.g. +1 555-123-4567" required>
                                        <div class="invalid-feedback" th:errors="*{phone}">Phone number required</div>
                                    </div>
                                </div>

                                <!-- Organization / Company -->
                                <div class="col-md-6">
                                    <label for="organization" class="form-label fw-semibold">Organization / Affiliation</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-building"></i></span>
                                        <input type="text" id="organization" th:field="*{organization}" class="form-control"
                                               placeholder="e.g. Apex Systems or Independent">
                                    </div>
                                </div>

                                <!-- Role / Title -->
                                <div class="col-md-6">
                                    <label for="roleTitle" class="form-label fw-semibold">Title / Role</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-briefcase"></i></span>
                                        <input type="text" id="roleTitle" th:field="*{roleTitle}" class="form-control"
                                               placeholder="e.g. Software Engineer, Designer, Lead">
                                    </div>
                                </div>

                                <!-- Special Notes -->
                                <div class="col-12">
                                    <label for="specialNotes" class="form-label fw-semibold">Notes / Requests (Optional)</label>
                                    <textarea id="specialNotes" th:field="*{specialNotes}" class="form-control" rows="3"
                                              placeholder="Any dietary requirements, team members, or questions for organizers..."></textarea>
                                </div>

                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg w-100 py-3 shadow-sm">
                                        <i class="bi bi-check2-circle me-1"></i> Complete Registration
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
